# NuDat: MySQL + JupyterLab + Streamlit on a shared Docker network
#
# Images (Docker Hub):
#   isabeln9/nudat3-jupyter:latest
#   isabeln9/nudat3-streamlit:latest
#   mysql:8.0  (oficial)
#
# Usage:
#   ./run_app.sh                 # pull + up + carga datos + abre la app
#   docker compose pull && docker compose up -d
#   docker compose up -d --build # reconstruir localmente y etiquetar con los nombres de Hub
#   # Jupyter: http://localhost:8888  (token: nudat)
#   # Streamlit: http://localhost:8501
#   # MySQL:   localhost:3306  user/pass/db: nudat/nudat/nudat

services:
  mysql:
    image: mysql:8.0
    container_name: nudat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nudatroot
      MYSQL_DATABASE: nudat
      MYSQL_USER: nudat
      MYSQL_PASSWORD: nudat
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - nudat_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pnudatroot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  jupyter:
    image: isabeln9/nudat3-jupyter:latest
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: nudat-jupyter
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: nudat
      MYSQL_PASSWORD: nudat
      MYSQL_DATABASE: nudat
      JUPYTER_TOKEN: nudat
      PYTHONPATH: /home/jovyan/work
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/jovyan/work
    working_dir: /home/jovyan/work
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nudat_net
    # JupyterLab with fixed token; repo is the working directory
    command: >
      start-notebook.py
      --ServerApp.root_dir=/home/jovyan/work
      --IdentityProvider.token=nudat
      --ServerApp.ip=0.0.0.0

  streamlit:
    image: isabeln9/nudat3-streamlit:latest
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: nudat-streamlit
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: nudat
      MYSQL_PASSWORD: nudat
      MYSQL_DATABASE: nudat
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nudat_net

volumes:
  mysql_data:

networks:
  nudat_net:
    name: nudat_net
    driver: bridge
